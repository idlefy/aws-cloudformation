AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Idlefy provision role (template __TEMPLATE_VERSION__). Opt-in: lets Idlefy create dev boxes
  for your organization. Every resource Idlefy creates must carry the tag IdlefyManaged=true,
  and Idlefy can only change or delete resources that carry it. Regions, instance types and
  volume size are limited to the values you set below. Delete this stack to revoke provisioning;
  the manage role keeps working.

Metadata:
  Idlefy:
    TemplateVersion: __TEMPLATE_VERSION__
    Repository: https://github.com/idlefy/aws-cloudformation
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Idlefy }
        Parameters: [OrgId, IssuerHost]
      - Label: { default: Limits }
        Parameters: [AllowedRegions, AllowedInstanceTypes, MaxVolumeGiB]
    ParameterLabels:
      OrgId: { default: Idlefy organization ID }
      IssuerHost: { default: Idlefy OIDC issuer host }
      AllowedRegions: { default: Regions where Idlefy may create dev boxes }
      AllowedInstanceTypes: { default: Instance types Idlefy may launch }
      MaxVolumeGiB: { default: Largest root volume Idlefy may create (GiB) }

Parameters:
  OrgId:
    Type: String
    Description: Your Idlefy organization ID (UUID). Prefilled by Idlefy; do not change.
    AllowedPattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ConstraintDescription: must be a lowercase UUID
  IssuerHost:
    Type: String
    Description: Host of the Idlefy OIDC issuer without https:// (app.idlefy.com). Prefilled by Idlefy; do not change.
    AllowedPattern: ^[a-z0-9.-]+(/[A-Za-z0-9._-]+)*$
    MinLength: 3
  AllowedRegions:
    Type: CommaDelimitedList
    Description: Comma-separated AWS regions, e.g. eu-central-1,us-east-1. Idlefy cannot touch EC2 anywhere else.
  AllowedInstanceTypes:
    Type: CommaDelimitedList
    Description: Comma-separated instance types Idlefy may launch, e.g. m7i.large,m7i.xlarge,g6.xlarge.
  MaxVolumeGiB:
    Type: Number
    Default: 1024
    MinValue: 8
    MaxValue: 16384
    Description: Upper bound for any EBS volume Idlefy creates.

Resources:
  ProvisionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub
        - IdlefyProvisionPolicy-${Suffix}
        - Suffix: !Join ["", [!Select [0, !Split ["-", !Ref OrgId]], !Select [1, !Split ["-", !Ref OrgId]]]]
      Description: Fence for the Idlefy provision role - tag-scoped create/mutate, allowlisted regions and instance types.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Describe
            Effect: Allow
            Action:
              - ec2:Describe*
              - ec2:GetConsoleOutput   # reserved for S3/S4: boot diagnostics for a stuck box
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AllowedRegions

          - Sid: DescribeGlobal
            Effect: Allow
            Action:
              - servicequotas:GetServiceQuota
              # GetServiceQuota returns only quotas the account has already changed; for an
              # untouched quota the documented fallback is the AWS default value. Without this
              # every limit preflight reports would be unknown on a fresh account.
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListServiceQuotas
              - pricing:GetProducts   # reserved for S3/S4: instance price lookups
            Resource: "*"

          # EBS encryption defaults are not covered by ec2:Describe*.
          - Sid: EbsEncryptionDefaults
            Effect: Allow
            Action:
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetEbsDefaultKmsKeyId
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AllowedRegions

          - Sid: UbuntuAmiLookup
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters   # reserved for S3/S4: resolving several AMIs in one call
            Resource: arn:aws:ssm:*::parameter/aws/service/canonical/ubuntu/*

          # Resource "*" does NOT let the request tag authorize the parent VPC of a
          # CreateSubnet / CreateSecurityGroup / CreateRouteTable call: aws:RequestTag is in the
          # request context only for the resource being tagged, so this statement never matches
          # the vpc/* side and CreateInManagedVpc below is what authorizes it, on the VPC's own
          # tag. Verified by DryRun against the v1.0.1 role on 2026-09-16: CreateSubnet into the
          # account's default VPC is denied on the vpc/* resource with no matched statement.
          - Sid: CreateTagged
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:CreateSubnet
              - ec2:CreateInternetGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:AllocateAddress
              - ec2:CreateVolume   # reserved for S3/S4: extra data volumes
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"
                aws:RequestedRegion: !Ref AllowedRegions

          - Sid: CreateInManagedVpc
            Effect: Allow
            Action:
              - ec2:CreateSubnet
              - ec2:CreateSecurityGroup
              - ec2:CreateRouteTable
            Resource: arn:aws:ec2:*:*:vpc/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          - Sid: RunInstancesInstance
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:instance/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"
                aws:RequestedRegion: !Ref AllowedRegions
                ec2:InstanceType: !Ref AllowedInstanceTypes

          - Sid: RunInstancesVolume
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:volume/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"
                aws:RequestedRegion: !Ref AllowedRegions
              NumericLessThanEquals:
                ec2:VolumeSize: !Ref MaxVolumeGiB

          - Sid: RunInstancesManagedNetwork
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - arn:aws:ec2:*:*:subnet/*
              - arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          # The primary network interface is CREATED by RunInstances, so it has no
          # resource tag to match yet: fence it like the instance and the volume.
          - Sid: RunInstancesNetworkInterface
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:network-interface/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"
                aws:RequestedRegion: !Ref AllowedRegions

          - Sid: RunInstancesImage
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*::image/*
            Condition:
              StringEquals:
                ec2:Owner:
                  - "099720109477"
                  - amazon

          # Encrypted root volumes: EC2 calls KMS on the caller's behalf with the account's
          # EBS key. Without these a launch or start succeeds and the instance then stops or
          # terminates with Client.InvalidKMSKey.* (the permissions boundary equals this
          # policy). A customer-managed key must also allow the account in its key policy.
          # What limits these to YOUR OWN keys is the Resource ARN, not a condition:
          # kms:CallerAccount matches the account of the CALLER, which in a role policy is
          # always this account, so it can never exclude a key owned elsewhere. It is kept
          # because it is the documented pairing for ViaService, but the account-scoped ARN
          # is the control: without it, a key shared into this account from another account
          # could be used through EC2.
          - Sid: EbsEncryptionKms
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncrypt*
            Resource: !Sub arn:aws:kms:*:${AWS::AccountId}:key/*
            Condition:
              StringLike:
                kms:ViaService: ec2.*.amazonaws.com
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

          - Sid: EbsEncryptionKmsGrant
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !Sub arn:aws:kms:*:${AWS::AccountId}:key/*
            Condition:
              StringLike:
                kms:ViaService: ec2.*.amazonaws.com
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"
              Bool:
                kms:GrantIsForAWSResource: "true"

          - Sid: CreateTagsOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: "*"
            Condition:
              StringEquals:
                ec2:CreateAction:
                  - RunInstances
                  - CreateVpc
                  - CreateSubnet
                  - CreateInternetGateway
                  - CreateRouteTable
                  - CreateSecurityGroup
                  - AllocateAddress
                  - CreateVolume

          - Sid: MutateManaged
            Effect: Allow
            Action:
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:StartInstances
              - ec2:RebootInstances   # reserved for S3/S4: "restart my box"
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute   # reserved for S3/S4: repairing a hand-edited route table
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              # reserved for S3/S4: egress policies per box (today the default allow-all stands)
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupEgress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:ReleaseAddress
              - ec2:DeleteVolume   # reserved for S3/S4: detached data volumes
            Resource: "*"
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          # reserved for S3/S4: browser SSH without the user's own key on the box
          - Sid: InstanceConnect
            Effect: Allow
            Action: ec2-instance-connect:SendSSHPublicKey
            Resource: arn:aws:ec2:*:*:instance/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          - Sid: DenyEscalation
            Effect: Deny
            Action:
              - iam:PassRole
              - ec2:AssociateIamInstanceProfile
              - ec2:ReplaceIamInstanceProfileAssociation
              - ec2:ModifyInstanceAttribute
              - ec2:DeleteTags
              - sts:*
              - organizations:*
            Resource: "*"

          - Sid: DenyOutsideAllowedRegions
            Effect: Deny
            Action:
              - ec2:*
              - ec2-instance-connect:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref AllowedRegions

  ProvisionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - IdlefyProvision-${Suffix}
        - Suffix: !Join ["", [!Select [0, !Split ["-", !Ref OrgId]], !Select [1, !Split ["-", !Ref OrgId]]]]
      Description: Idlefy provision tier - creates dev boxes tagged IdlefyManaged=true within the configured limits.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Ref ProvisionPolicy
      PermissionsBoundary: !Ref ProvisionPolicy
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${IssuerHost}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${IssuerHost}:aud": "sts.amazonaws.com",
                  "${IssuerHost}:sub": "${OrgId}:provision"
                }
              }
            }
          ]
        }
      Tags:
        - { Key: Idlefy, Value: provision }
        - { Key: IdlefyOrg, Value: !Ref OrgId }
        - { Key: IdlefyTemplateVersion, Value: __TEMPLATE_VERSION__ }

Outputs:
  RoleArn:
    Description: Provision role Idlefy assumes for this organization (Idlefy derives it; nothing to copy).
    Value: !GetAtt ProvisionRole.Arn
  PolicyArn:
    Description: The fence policy, attached to the role and set as its permissions boundary.
    Value: !Ref ProvisionPolicy
