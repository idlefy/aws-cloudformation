AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Idlefy provision role (template __TEMPLATE_VERSION__). Opt-in: lets Idlefy create dev boxes
  for your organization. Every resource Idlefy creates must carry the tag IdlefyManaged=true,
  and Idlefy can only change or delete resources that carry it. Regions, instance types and
  volume size are limited to the values you set below. Delete this stack to revoke provisioning;
  the manage role keeps working.

Metadata:
  Idlefy:
    TemplateVersion: __TEMPLATE_VERSION__
    Repository: https://github.com/idlefy/aws-cloudformation
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Idlefy }
        Parameters: [OrgId, IssuerHost]
      - Label: { default: Limits }
        Parameters: [AllowedRegions, AllowedInstanceTypes, MaxVolumeGiB]
      - Label: { default: Optional abilities }
        Parameters: [AllowZoneMove]
    ParameterLabels:
      OrgId: { default: Idlefy organization ID }
      IssuerHost: { default: Idlefy OIDC issuer host }
      AllowedRegions: { default: Regions where Idlefy may create dev boxes }
      AllowedInstanceTypes: { default: Instance types Idlefy may launch }
      MaxVolumeGiB: { default: Largest root volume Idlefy may create (GiB) }
      AllowZoneMove: { default: Let Idlefy move a dev box to another availability zone }

Parameters:
  OrgId:
    Type: String
    Description: Your Idlefy organization ID (UUID). Prefilled by Idlefy; do not change.
    AllowedPattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ConstraintDescription: must be a lowercase UUID
  IssuerHost:
    Type: String
    Description: Host of the Idlefy OIDC issuer without https:// (app.idlefy.com). Prefilled by Idlefy; do not change.
    AllowedPattern: ^[a-z0-9.-]+(/[A-Za-z0-9._-]+)*$
    MinLength: 3
  AllowedRegions:
    Type: CommaDelimitedList
    Description: Comma-separated AWS regions, e.g. eu-central-1,us-east-1. Idlefy cannot touch EC2 anywhere else.
  AllowedInstanceTypes:
    Type: CommaDelimitedList
    Description: Comma-separated instance types Idlefy may launch, e.g. m7i.large,m7i.xlarge,g6.xlarge.
  MaxVolumeGiB:
    Type: Number
    Default: 1024
    MinValue: 8
    MaxValue: 16384
    Description: Upper bound for any EBS volume Idlefy creates.
  AllowZoneMove:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Off by default. When AWS has no capacity for a dev box in its zone, a person can ask
      Idlefy to move the box to another zone. AWS cannot move a disk between zones, so Idlefy
      copies it and starts a new instance from the copy. Turning this on therefore lets the
      Idlefy role copy the disk of a dev box it created and start an instance from that copy:
      the one ability in this template that touches the data on a box. The copy cannot be
      shared or exported and is deleted after the move; every step is in your CloudTrail
      (CreateImage, RunInstances). Leave it off and Idlefy can never reach the data on a box;
      people can still retry and switch to another allowed machine type.

Conditions:
  ZoneMove: !Equals [!Ref AllowZoneMove, "true"]

Resources:
  ProvisionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub
        - IdlefyProvisionPolicy-${Suffix}
        - Suffix: !Join ["", [!Select [0, !Split ["-", !Ref OrgId]], !Select [1, !Split ["-", !Ref OrgId]]]]
      # NEVER edit this text. CloudFormation replaces a managed policy whose Description (or
      # name, or path) changes, and a policy with a fixed name cannot be replaced: the update
      # fails with "already exists" and rolls back. v1.4.0 reworded it and could not update any
      # existing stack. It still says "and instance types" although that list moved to the role.
      Description: Fence for the Idlefy provision role - tag-scoped create/mutate, allowlisted regions and instance types.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # No statement below states a region. DenyOutsideAllowedRegions, in the role's inline
          # policy IdlefyProvisionLimits (since v1.5.0; in this policy before), denies every EC2
          # call outside AllowedRegions, and a deny beats any allow. IAM caps a managed policy at
          # 6,144 characters, and v1.3.0 went over it at 20 regions and 50 types.
          - Sid: Describe
            Effect: Allow
            Action:
              - ec2:Describe*
            Resource: "*"

          - Sid: DescribeGlobal
            Effect: Allow
            Action:
              - servicequotas:GetServiceQuota
              # GetServiceQuota returns only quotas the account has already changed; for an
              # untouched quota the documented fallback is the AWS default value. Without this
              # every limit preflight reports would be unknown on a fresh account.
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListServiceQuotas
              - pricing:GetProducts   # reserved for S3/S4: instance price lookups
            Resource: "*"

          # EBS encryption defaults are not covered by ec2:Describe*.
          - Sid: EbsEncryptionDefaults
            Effect: Allow
            Action:
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetEbsDefaultKmsKeyId
            Resource: "*"

          # The public parameters the image publishers keep pointed at their latest AMI:
          # Canonical (Ubuntu) and, since v1.3.0, Debian. Public parameters have no account id.
          - Sid: ImageLookup
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - arn:aws:ssm:*::parameter/aws/service/canonical/ubuntu/*
              - arn:aws:ssm:*::parameter/aws/service/debian/release/*

          # v1.3.0: Idlefy reads the parameters of THIS stack (AllowedRegions,
          # AllowedInstanceTypes, MaxVolumeGiB) and warns you when they differ from what it
          # has stored. Read-only, this one stack only. The trailing /* is required: a call
          # that names the stack matches only an ARN that ends in a wildcard.
          - Sid: ReadOwnStack
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*

          # Resource "*" does NOT let the request tag authorize the parent VPC of a
          # CreateSubnet / CreateSecurityGroup / CreateRouteTable call: aws:RequestTag is in the
          # request context only for the resource being tagged, so this statement never matches
          # the vpc/* side and CreateInManagedVpc below is what authorizes it, on the VPC's own
          # tag. Verified by DryRun against the v1.0.1 role on 2026-09-16: CreateSubnet into the
          # account's default VPC is denied on the vpc/* resource with no matched statement.
          - Sid: CreateTagged
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:CreateSubnet
              - ec2:CreateInternetGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:AllocateAddress
              # v1.4.0, only with AllowZoneMove: the image and the snapshot behind it that
              # CreateImage makes when a dev box is moved to another zone. Both must be tagged
              # IdlefyManaged at creation.
              - !If [ZoneMove, "ec2:CreateImage", !Ref "AWS::NoValue"]
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"

          - Sid: CreateInManagedVpc
            Effect: Allow
            Action:
              - ec2:CreateSubnet
              - ec2:CreateSecurityGroup
              - ec2:CreateRouteTable
            Resource: arn:aws:ec2:*:*:vpc/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          # v1.5.0: a network of YOURS that you attached to Idlefy by tagging the VPC
          # IdlefyAttached=<your Idlefy organization id>. The tag lets Idlefy create its own
          # per-box security group in that VPC (the group itself must be tagged IdlefyManaged at
          # creation, by CreateTagged above) and nothing else: no statement lets the role change
          # or delete a VPC, subnet, route or gateway that carries IdlefyAttached.
          - Sid: CreateGroupInAttachedVpc
            Effect: Allow
            Action: ec2:CreateSecurityGroup
            Resource: arn:aws:ec2:*:*:vpc/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyAttached: !Ref OrgId

          # v1.4.0: WHICH instance types may be launched is no longer stated here. It is a deny in
          # the role's own policy (IdlefyProvisionLimits, below), so the list is rendered outside
          # this size-capped document.
          - Sid: RunInstancesInstance
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:instance/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"

          # v1.4.0, only with AllowZoneMove: moving a dev box to another zone. AWS cannot move a
          # disk between zones, so Idlefy copies it: an image of the box, a new instance from
          # that image in the other zone, then the image and its snapshot are deleted. The
          # source must be an instance Idlefy created, and no snapshot Idlefy did not create
          # can be pulled into the image (verified: denied on the snapshot). The copy cannot
          # leave this account (sharing is denied outright below, copying and exporting are not
          # granted) and cannot be read block by block (ebs:* is denied below).
          # What this DOES make possible, and why it is opt-in: the role can start an instance
          # from the copy, and IAM has no way to limit the user data of a launch. A role that
          # can move a box can therefore, in principle, boot a copy of its disk with a startup
          # script of its choosing. Idlefy starts the copy with a fixed user data that only
          # keeps the SSH host keys; the CreateImage -> RunInstances pair is in CloudTrail.
          # IAM also has no condition on the state of the source instance, so "the box is
          # stopped first" is what Idlefy does, not what this statement enforces.
          - !If
            - ZoneMove
            - Sid: CopyDiskOfManagedInstance
              Effect: Allow
              Action: ec2:CreateImage
              Resource: arn:aws:ec2:*:*:instance/*
              Condition:
                StringEquals:
                  ec2:ResourceTag/IdlefyManaged: "true"
            - !Ref "AWS::NoValue"

          # v1.4.0: changing the machine type of a stopped dev box. ModifyInstanceAttribute can
          # also replace the user data (code that runs inside the box on its next boot), swap
          # security groups and lift termination protection, so it is opened for exactly one
          # attribute: the request must carry InstanceType (the Null test), on an instance
          # Idlefy created. DenyOtherInstanceAttributes below denies every other use, and
          # IdlefyProvisionLimits on the role denies a type outside AllowedInstanceTypes.
          - Sid: ChangeInstanceType
            Effect: Allow
            Action: ec2:ModifyInstanceAttribute
            Resource: arn:aws:ec2:*:*:instance/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"
              "Null":
                ec2:Attribute/InstanceType: "false"

          # v1.5.0: putting a box behind Idlefy's own security group. The security groups named
          # in a ModifyInstanceAttribute call are resources of that call, so the tag condition
          # holds for each of them: the role can set the group list of an instance that carries
          # IdlefyManaged only to groups that carry IdlefyManaged too (groups Idlefy created). It
          # can never attach a group of yours, and never touch an instance without the tag.
          # Verified 2026-10-09: a list that names an untagged group is denied on that group.
          - Sid: SwitchToManagedGroups
            Effect: Allow
            Action: ec2:ModifyInstanceAttribute
            Resource:
              - arn:aws:ec2:*:*:instance/*
              - arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"
              "Null":
                ec2:Attribute/InstanceType: "true"

          - Sid: RunInstancesVolume
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:volume/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"
              NumericLessThanEquals:
                ec2:VolumeSize: !Ref MaxVolumeGiB

          - Sid: RunInstancesManagedNetwork
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - arn:aws:ec2:*:*:subnet/*
              - arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          # v1.5.0: launching into a subnet of an attached network (see CreateGroupInAttachedVpc).
          # The tag is read from the SUBNET, so you choose subnet by subnet where Idlefy may
          # launch; the security group must still be one Idlefy created (statement above).
          - Sid: RunInAttachedSubnet
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:subnet/*
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyAttached: !Ref OrgId

          # The primary network interface is CREATED by RunInstances, so it has no
          # resource tag to match yet: fence it like the instance and the volume.
          - Sid: RunInstancesNetworkInterface
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*:*:network-interface/*
            Condition:
              StringEquals:
                aws:RequestTag/IdlefyManaged: "true"

          - Sid: RunInstancesImage
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*::image/*
            Condition:
              # Whose images may be launched: Canonical (Ubuntu), Amazon, Debian (v1.3.0) and
              # this account's own images (v1.3.0, "custom images"). Never an image shared in
              # from another account, and never a Marketplace image.
              StringEquals:
                ec2:Owner:
                  - "099720109477"
                  - amazon
                  - "136693071363"
                  - !Ref "AWS::AccountId"

          # Encrypted root volumes: EC2 calls KMS on the caller's behalf with the account's
          # EBS key. Without these a launch or start succeeds and the instance then stops or
          # terminates with Client.InvalidKMSKey.* (the permissions boundary equals this
          # policy). A customer-managed key must also allow the account in its key policy.
          # What limits these to YOUR OWN keys is the Resource ARN, not a condition:
          # kms:CallerAccount matches the account of the CALLER, which in a role policy is
          # always this account, so it can never exclude a key owned elsewhere. It is kept
          # because it is the documented pairing for ViaService, but the account-scoped ARN
          # is the control: without it, a key shared into this account from another account
          # could be used through EC2.
          - Sid: EbsEncryptionKms
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncrypt*
            Resource: !Sub arn:aws:kms:*:${AWS::AccountId}:key/*
            Condition:
              StringLike:
                kms:ViaService: ec2.*.amazonaws.com
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

          - Sid: EbsEncryptionKmsGrant
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !Sub arn:aws:kms:*:${AWS::AccountId}:key/*
            Condition:
              StringLike:
                kms:ViaService: ec2.*.amazonaws.com
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"
              Bool:
                kms:GrantIsForAWSResource: "true"

          - Sid: CreateTagsOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: "*"
            Condition:
              StringEquals:
                ec2:CreateAction:
                  - RunInstances
                  - CreateVpc
                  - CreateSubnet
                  - CreateInternetGateway
                  - CreateRouteTable
                  - CreateSecurityGroup
                  - AllocateAddress
                  - !If [ZoneMove, CreateImage, !Ref "AWS::NoValue"]

          - Sid: MutateManaged
            Effect: Allow
            Action:
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:StartInstances
              - ec2:RebootInstances   # reserved for S3/S4: "restart my box"
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              # v1.2.0: dual-stack. A network Idlefy built before IPv6 gets its Amazon-provided
              # /56 (VPC) and /64 (subnet) here; a new network gets them at CreateVpc/CreateSubnet.
              # IAM has no condition key for the requested block type, so AssociateVpcCidrBlock
              # could also add a secondary IPv4 range. Accepted: the IdlefyManaged resource tag
              # fences it to VPCs Idlefy created, which CreateVpc already lets it build with any
              # range, so it grants no reach beyond Idlefy's own networks. Idlefy only ever sends
              # AmazonProvidedIpv6CidrBlock=true.
              - ec2:AssociateVpcCidrBlock
              - ec2:AssociateSubnetCidrBlock
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute   # reserved for S3/S4: repairing a hand-edited route table
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:ReleaseAddress
              # v1.4.0, only with AllowZoneMove: removing the temporary disk copy once the box
              # runs in its new zone.
              - !If [ZoneMove, "ec2:DeregisterImage", !Ref "AWS::NoValue"]
              - !If [ZoneMove, "ec2:DeleteSnapshot", !Ref "AWS::NoValue"]
            Resource: "*"
            Condition:
              StringEquals:
                ec2:ResourceTag/IdlefyManaged: "true"

          - Sid: DenyEscalation
            Effect: Deny
            Action:
              # Idlefy must never be able to get inside a box it manages, or to read what is
              # inside it. SendSSHPublicKey pushes a caller-chosen SSH key onto a running
              # instance; GetConsoleOutput and GetConsoleScreenshot return the guest's own
              # output — the boot log, kernel messages, whatever cloud-init printed, the
              # screen. All are denied outright rather than merely left ungranted: a Deny
              # cannot be undone by a later Allow, here or in any policy attached to this
              # role. v1.0.0 and v1.0.1 granted the first two; nothing ever used them.
              - ec2-instance-connect:*
              - ec2:GetConsole*
              - iam:PassRole
              - ec2:AssociateIamInstanceProfile
              - ec2:ReplaceIamInstanceProfileAssociation
              - ec2:DeleteTags
              # v1.4.0: an image or a snapshot is never shared with another account and never
              # read block by block, whether or not AllowZoneMove is on. The first two change
              # who may use a snapshot or an image; ebs:* is direct access to a snapshot's blocks.
              - ec2:ModifySnapshotAttribute
              - ec2:ModifyImageAttribute
              - ebs:*
              # Nor copied or exported: the last three write a disk to an S3 bucket named in the
              # request, which can belong to another account. None is granted; they are denied
              # so that no later edit can grant them.
              - ec2:CopySnapshot
              - ec2:CopyImage
              - ec2:CreateStoreImageTask
              - ec2:ExportImage
              - ec2:CreateInstanceExportTask
              - sts:*
              - organizations:*
            Resource: "*"

          # v1.4.0: replaces the outright deny of ec2:ModifyInstanceAttribute that v1.0.0-v1.3.0
          # kept in DenyEscalation. v1.5.0: any call that carries neither InstanceType nor the
          # group list - user data, termination and stop protection, source/dest check, the
          # disks' delete-on-termination, every other attribute - is denied, and no later allow
          # can undo it. It is scoped to instances on purpose: the attribute keys exist only on
          # the instance side of the call, so on "*" this statement would also match the security
          # groups of a group change and deny it (verified 2026-10-09).
          - Sid: DenyOtherInstanceAttributes
            Effect: Deny
            Action: ec2:ModifyInstanceAttribute
            Resource: arn:aws:ec2:*:*:instance/*
            Condition:
              "Null":
                ec2:Attribute/InstanceType: "true"
                ec2:Attribute/Groups: "true"

          # The statement above relies on EC2 accepting one attribute per call ("The request
          # must contain a single attribute", verified 2026-10-08). User data is code that runs
          # inside the box, so it does not rest on that rule alone: any call that carries it is
          # denied by IAM itself, whatever else the call carries.
          - Sid: DenyUserDataChange
            Effect: Deny
            Action: ec2:ModifyInstanceAttribute
            Resource: "*"
            Condition:
              "Null":
                ec2:Attribute/UserData: "false"

  ProvisionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - IdlefyProvision-${Suffix}
        - Suffix: !Join ["", [!Select [0, !Split ["-", !Ref OrgId]], !Select [1, !Split ["-", !Ref OrgId]]]]
      Description: Idlefy provision tier - creates dev boxes tagged IdlefyManaged=true within the configured limits.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Ref ProvisionPolicy
      PermissionsBoundary: !Ref ProvisionPolicy
      # v1.4.0: the instance-type limit. It lives here, in the role's own policy, because the
      # list appears twice and IAM caps the managed policy above at 6,144 characters (a role's
      # inline policies get 10,240 of their own). Both statements are denies: the permissions
      # boundary only limits what can be allowed, and an explicit deny holds whatever is
      # attached to this role later.
      Policies:
        - PolicyName: IdlefyProvisionLimits
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyLaunchOutsideAllowedTypes
                Effect: Deny
                Action: ec2:RunInstances
                Resource: arn:aws:ec2:*:*:instance/*
                Condition:
                  StringNotEquals:
                    ec2:InstanceType: !Ref AllowedInstanceTypes
              # The Null test keeps this statement about type changes only; a call that changes
              # any other attribute is denied by DenyOtherInstanceAttributes in the fence policy.
              - Sid: DenyTypeChangeOutsideAllowedTypes
                Effect: Deny
                Action: ec2:ModifyInstanceAttribute
                Resource: "*"
                Condition:
                  StringNotEquals:
                    ec2:Attribute/InstanceType: !Ref AllowedInstanceTypes
                  "Null":
                    ec2:Attribute/InstanceType: "false"
              # v1.5.0: the region limit moved here from the fence policy, for the same size
              # reason as the type list. It is the ONLY region limit: no allow in the fence
              # policy repeats the list.
              - Sid: DenyOutsideAllowedRegions
                Effect: Deny
                Action:
                  - ec2:*
                  - ec2-instance-connect:*
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: !Ref AllowedRegions
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${IssuerHost}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "${IssuerHost}:aud": "sts.amazonaws.com",
                  "${IssuerHost}:sub": "${OrgId}:provision"
                }
              }
            }
          ]
        }
      Tags:
        - { Key: Idlefy, Value: provision }
        - { Key: IdlefyOrg, Value: !Ref OrgId }
        - { Key: IdlefyTemplateVersion, Value: __TEMPLATE_VERSION__ }

Outputs:
  RoleArn:
    Description: Provision role Idlefy assumes for this organization (Idlefy derives it; nothing to copy).
    Value: !GetAtt ProvisionRole.Arn
  PolicyArn:
    Description: The fence policy, attached to the role and set as its permissions boundary.
    Value: !Ref ProvisionPolicy
  # v1.4.0: Idlefy reads this through ReadOwnStack to know which version is deployed, and so
  # whether it may offer changing the machine type. Whether it may offer a move to another
  # zone it reads from the AllowZoneMove parameter, the same way.
  TemplateVersion:
    Description: Version of this template as deployed.
    Value: __TEMPLATE_VERSION__
