AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Idlefy manage role (template __TEMPLATE_VERSION__). Lets Idlefy discover and start/stop
  the EC2 instances you tag with Idlefy=enabled. It cannot create, terminate or resize anything.
  Access is granted only to short-lived web-identity tokens issued by Idlefy for your organization.

Metadata:
  Idlefy:
    TemplateVersion: __TEMPLATE_VERSION__
    Repository: https://github.com/idlefy/aws-cloudformation
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Idlefy }
        Parameters: [OrgId, IssuerHost]
      - Label: { default: Options }
        Parameters: [CreateOidcProvider, IncludeMetrics]
      - Label: { default: Sign-in (prefilled by Idlefy) }
        Parameters: [Federation, IdentityPoolId, CognitoAccountId]
    ParameterLabels:
      OrgId: { default: Idlefy organization ID }
      IssuerHost: { default: Idlefy OIDC issuer host }
      CreateOidcProvider: { default: Create the OIDC identity provider }
      IncludeMetrics: { default: Allow CloudWatch metrics (Smart Protection) }
      Federation: { default: How Idlefy signs in to this role }
      IdentityPoolId: { default: Idlefy Cognito identity pool ID }
      CognitoAccountId: { default: AWS account of the Idlefy identity pool }

Parameters:
  OrgId:
    Type: String
    Description: Your Idlefy organization ID (UUID). Prefilled by Idlefy; do not change.
    AllowedPattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ConstraintDescription: must be a lowercase UUID
  IssuerHost:
    Type: String
    Description: Host of the Idlefy OIDC issuer without https:// (app.idlefy.com). Prefilled by Idlefy; do not change.
    AllowedPattern: '^[a-z0-9.-]+(/[A-Za-z0-9._-]+)*$'
    MinLength: 3
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if this AWS account already has the Idlefy OIDC provider (another Idlefy
      organization or a manual setup). Stack error "EntityAlreadyExists" means set false;
      "Invalid principal in policy" means set true. Ignored when Federation is cognito.
  IncludeMetrics:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Allow cloudwatch:GetMetricData and ListMetrics so Idlefy can see CPU/network activity before stopping a VM.
  Federation:
    Type: String
    Default: oidc
    AllowedValues: [oidc, cognito]
    Description: >-
      oidc - Idlefy's token is trusted through an OIDC identity provider in this account.
      cognito - it is trusted through Idlefy's Cognito identity pool; no identity provider is
      created or needed. Prefilled by Idlefy; do not change.
  IdentityPoolId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z]{2}(-[a-z]+)+-[0-9]:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ConstraintDescription: must be empty or a Cognito identity pool ID (region:uuid)
    Description: Idlefy's Cognito identity pool (Federation cognito only). Prefilled by Idlefy; do not change.
  CognitoAccountId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9]{12}$'
    ConstraintDescription: must be empty or a 12-digit AWS account ID
    Description: AWS account that holds Idlefy's identity pool (Federation cognito only). Prefilled by Idlefy; do not change.

Rules:
  CognitoNeedsPool:
    RuleCondition: !Equals [!Ref Federation, cognito]
    Assertions:
      - Assert: !Not [!Equals [!Ref IdentityPoolId, ""]]
        AssertDescription: Federation cognito needs IdentityPoolId.
      - Assert: !Not [!Equals [!Ref CognitoAccountId, ""]]
        AssertDescription: Federation cognito needs CognitoAccountId.

Conditions:
  UseOidc: !Equals [!Ref Federation, oidc]
  UseCognito: !Not [!Condition UseOidc]
  CreateProvider: !And [!Equals [!Ref CreateOidcProvider, "true"], !Condition UseOidc]
  WithMetrics: !Equals [!Ref IncludeMetrics, "true"]

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: !Sub https://${IssuerHost}
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: Idlefy, Value: oidc }

  ManageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - IdlefyManage-${Suffix}
        - Suffix: !Join ["", [!Select [0, !Split ["-", !Ref OrgId]], !Select [1, !Split ["-", !Ref OrgId]]]]
      Description: Idlefy manage tier - discover and start/stop instances tagged Idlefy=enabled.
      MaxSessionDuration: 3600
      # cognito: the pool is the audience; the pin (the amr entry Cognito adds for a token from
      # this org's issuer) must be present, and no amr entry other than authenticated, the
      # issuer and the pin may be. The pool alone admits nobody.
      AssumeRolePolicyDocument: !If
        - UseCognito
        - !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "cognito-identity.amazonaws.com" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "cognito-identity.amazonaws.com:aud": "${IdentityPoolId}"
                    },
                    "ForAnyValue:StringEquals": {
                      "cognito-identity.amazonaws.com:amr": "${Pin}"
                    },
                    "ForAllValues:StringEquals": {
                      "cognito-identity.amazonaws.com:amr": ["authenticated", "${IssuerHost}", "${Pin}"]
                    }
                  }
                }
              ]
            }
          - Pin: !Sub arn:aws:iam::${CognitoAccountId}:oidc-provider/${IssuerHost}:OIDC:${OrgId}
        - !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${ProviderArn}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${IssuerHost}:aud": "sts.amazonaws.com",
                      "${IssuerHost}:sub": "${OrgId}"
                    }
                  }
                }
              ]
            }
          - ProviderArn: !If
              - CreateProvider
              - !Ref OidcProvider
              - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/${IssuerHost}
      Policies:
        - PolicyName: IdlefyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IdlefyCore
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeRegions
                Resource: "*"
              - Sid: IdlefyVMManagementLower
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/idlefy: enabled
              - Sid: IdlefyVMManagementUpper
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Idlefy: enabled
              - Sid: IdlefyPricing
                Effect: Allow
                Action:
                  - pricing:GetProducts
                Resource: "*"
              - !If
                - WithMetrics
                - Sid: IdlefyMetrics
                  Effect: Allow
                  Action:
                    - cloudwatch:GetMetricData
                    - cloudwatch:ListMetrics
                  Resource: "*"
                - !Ref AWS::NoValue
      Tags:
        - { Key: Idlefy, Value: manage }
        - { Key: IdlefyOrg, Value: !Ref OrgId }
        - { Key: IdlefyTemplateVersion, Value: __TEMPLATE_VERSION__ }

Outputs:
  RoleArn:
    Description: Role Idlefy assumes for this organization (Idlefy derives it; nothing to copy).
    Value: !GetAtt ManageRole.Arn
  OidcProviderArn:
    Description: OIDC identity provider used by the trust policy.
    Condition: UseOidc
    Value: !If
      - CreateProvider
      - !Ref OidcProvider
      - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/${IssuerHost}
