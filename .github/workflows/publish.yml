name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BUCKET: idlefy-cfn-templates
  ROLE_ARN: arn:aws:iam::995603458290:role/github-cfn-publish

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Stamp the version into the templates
        run: |
          mkdir -p dist
          for f in templates/*.yaml; do
            sed "s/__TEMPLATE_VERSION__/${GITHUB_REF_NAME}/g" "$f" > "dist/$(basename "$f")"
          done
          cfn-lint dist/*.yaml

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to cfn/<tag>/ and cfn/latest/
        run: |
          for prefix in "cfn/${GITHUB_REF_NAME}" "cfn/latest"; do
            aws s3 cp dist/ "s3://${BUCKET}/${prefix}/" --recursive \
              --content-type text/yaml --cache-control max-age=300
          done

      - name: Verify anonymous access
        run: |
          for f in dist/*.yaml; do
            url="https://${BUCKET}.s3.us-east-1.amazonaws.com/cfn/${GITHUB_REF_NAME}/$(basename "$f")"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            test "$code" = "200"
          done
